<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spruce Lodge Photos | Jackson & Rachel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page gallery-page">
      <nav class="top-nav" aria-label="Site navigation">
        <a class="text-link-back" href="index.html">Back to wedding info</a>
      </nav>

      <section class="hero gallery-hero" aria-labelledby="gallery-title">
      </section>

      

      <section
        class="feature-panel gallery-panel"
        id="guest-gallery-panel"
        aria-labelledby="guest-gallery-title"
        hidden
      >
        <div class="section-heading">
          <p class="eyebrow">From everyone</p>
          <h2 id="guest-gallery-title">Guest photos</h2>
          <p>
            Photos and videos shared by guests over the weekend.
            <a class="text-link" href="upload.html">Add yours</a>
          </p>
        </div>

        <div class="drive-gallery-frame">
          <iframe
            id="guest-gallery-frame"
            title="Google Drive gallery of guest photos"
            loading="lazy"
          ></iframe>
        </div>

        <div class="gallery-actions">
          <a
            class="button"
            id="guest-gallery-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
          >
            Open guest photos in Google Drive
          </a>
        </div>
      </section>

      <section class="feature-panel gallery-panel" aria-labelledby="drive-gallery-title">
        <div class="section-heading">
          <p class="eyebrow">Photo gallery</p>
          <h2 id="drive-gallery-title">Spruce Lodge</h2>

        </div>

        <div class="drive-gallery-frame">
          <iframe
            title="Google Drive gallery of Spruce Lodge photos"
            src="https://drive.google.com/embeddedfolderview?id=1qmCJA5mvrrd460VDr8Zt2z7eJ9CQMUVm#grid"
            loading="lazy"
          ></iframe>
        </div>

        <div class="gallery-actions">
          <a
            class="button"
            href="https://drive.google.com/drive/folders/1qmCJA5mvrrd460VDr8Zt2z7eJ9CQMUVm?usp=sharing"
            target="_blank"
            rel="noopener noreferrer"
          >
            Open photos in Google Drive
          </a>
        </div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="guest-gallery.js"></script>
  </body>
</html>
